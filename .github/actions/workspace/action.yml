name: Install workspace
description: Set up pnpm and Node 24, then install the frozen workspace.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 11.10.0
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

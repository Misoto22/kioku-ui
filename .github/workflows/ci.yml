name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/workspace
      - name: Require Changesets for package pull requests
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.user.login != 'github-actions[bot]' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.head_ref != 'changeset-release/main')
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      - run: pnpm check:repo
      - run: pnpm check:package-boundaries
      - run: pnpm format
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/workspace
      - run: pnpm build:packages
      - run: pnpm typecheck
      - run: pnpm test

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/workspace
      - run: pnpm build:packages
      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
        timeout-minutes: 10
      - run: pnpm a11y:audit

  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/workspace
      - run: pnpm build:packages
      - run: pnpm sandbox:build
      - run: pnpm verify-exports
      - run: pnpm --dir apps/example-vite install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir apps/example-vite build
      - run: pnpm --dir apps/example-nextjs install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir apps/example-nextjs build
      - run: pnpm --dir apps/example-vite-source install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir apps/example-vite-source build
      - run: pnpm --dir apps/example-nextjs-source install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir apps/example-nextjs-source build

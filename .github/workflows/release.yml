# Release the three public packages.
#
# release-please owns the version numbers. Every push to main hands main to the
# fleet reusable workflow, which mints a misoto22-release-bot App token and
# maintains one release pull request. Merging that pull request creates tag
# `vX.Y.Z` and a GitHub Release, and only then does `publish` run.
#
# The three packages share one version: the root package is the only
# release-please path, and `extra-files` rewrites each package.json. So a
# release never publishes two of them at different numbers.
#
# This filename is load-bearing. All three npm trusted publishers are bound to
# repository `Misoto22/kioku-ui`, workflow `release.yml` and environment `npm`;
# renaming the file or dropping the environment revokes the OIDC identity and
# the publish fails with no token to fall back on.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'Misoto22/kioku-ui'
    uses: Misoto22/ci/.github/workflows/release.yml@65443cf5cd7c65b978373aeb0a0e93127b0d6ede # v0.5.0
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      app-client-id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The audit only launches Chromium; --with-deps adds an apt step that has
      # hung this job indefinitely, and ubuntu-latest already carries the
      # libraries Playwright needs. The timeout keeps a hang from blocking the
      # release queue, which never cancels in-progress runs.
      - run: pnpm exec playwright install chromium
        timeout-minutes: 10
      - run: pnpm release:verify
      - name: Publish the public packages
        # npm mints the credential from the OIDC token; there is no NPM_TOKEN.
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm -r publish --access public --no-git-checks
